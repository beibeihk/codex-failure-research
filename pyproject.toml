[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-failure-research"
version = "0.1.0"
description = "Reproducible coding-agent reliability diagnosis with synthetic fixtures"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]
compressed = ["zstandard>=0.23,<1"]

[tool.setuptools.packages.find]
include = ["harness*", "analyzers*"]

